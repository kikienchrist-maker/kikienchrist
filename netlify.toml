# Netlify Configuration
# Deploy: netlify deploy --prod

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["**/*.js", "**/*.json"]
  external_node_modules = ["@netlify/functions"]

# Environment variables (set in Netlify dashboard)
# MAILERLITE_API_KEY
# MAILERLITE_GROUP_FR
# MAILERLITE_GROUP_EN
# MAILERLITE_GROUP_ES
# MAILERLITE_GROUP_PT
# MAILERLITE_GROUP_IT
# MAILERLITE_GROUP_DE
# MAILERLITE_GROUP_NL
# MAILERLITE_GROUP_PL
# MAILERLITE_GROUP_AR
# MAILERLITE_GROUP_LEAD_MAGNET

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/guides/*"
  [headers.values]
    Content-Disposition = "attachment"

[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  conditions = {Language = ["fr", "fr-FR"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  conditions = {Language = ["en", "en-US", "en-GB"]}

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  conditions = {Language = ["es", "es-ES", "es-MX"]}

[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  conditions = {Language = ["pt", "pt-PT", "pt-BR"]}

[[redirects]]
  from = "/"
  to = "/it/"
  status = 302
  conditions = {Language = ["it", "it-IT"]}

[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  conditions = {Language = ["de", "de-DE"]}

[[redirects]]
  from = "/"
  to = "/nl/"
  status = 302
  conditions = {Language = ["nl", "nl-NL"]}

[[redirects]]
  from = "/"
  to = "/pl/"
  status = 302
  conditions = {Language = ["pl", "pl-PL"]}

[[redirects]]
  from = "/"
  to = "/ar/"
  status = 302
  conditions = {Language = ["ar", "ar-SA", "ar-EG"]}

[[redirects]]
  from = "/*"
  to = "/fr/:splat"
  status = 302